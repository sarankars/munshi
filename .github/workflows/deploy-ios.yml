name: Deploy iOS App to TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (optional)"
        required: false
      renew_certificates:
        description: "Renew certificates and profiles via match (set true if certificate expired)"
        type: boolean
        required: false
        default: false

jobs:
  build-and-deploy-ios:
    runs-on: macos-15 # macOS Sequoia with Xcode 16

    env:
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

    steps:
      - name: 🧹 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      - name: 🔑 Decode App Store Connect API key
        run: |
          mkdir -p ios
          echo "${{ secrets.APPSTORE_KEY }}" | base64 --decode > ios/AuthKey_6W3U9Q7XKG.p8

      - name: 🗂️ Restore environment configuration
        run: |
          echo "${{ secrets.ENV_JSON }}" | base64 --decode > env.json

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🚧 Build iOS (config-only)
        run: |
          flutter build ios --release --no-codesign --config-only \
            --no-tree-shake-icons \
            --dart-define-from-file=env.json

      - name: 💎 Install Ruby gems for iOS
        working-directory: ios
        run: |
          gem install bundler
          bundle install

      - name: ⚙️ Configure Git for Fastlane commits
        run: |
          git config --global user.email "bot@sarankar.com"
          git config --global user.name "Fastlane CI"

      - name: 🚀 Deploy iOS app to TestFlight
        working-directory: ios
        env:
          RELEASE_NOTES: ${{ github.event.inputs.notes }}
          MATCH_READONLY: ${{ github.event.inputs.renew_certificates && 'false' || 'true' }}
        run: |
          echo "Notes: $RELEASE_NOTES"
          echo "Match readonly: $MATCH_READONLY"
          bundle exec fastlane beta
